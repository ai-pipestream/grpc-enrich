name: Publish Images

# Builds the service image and pushes it to docker.io/pipestreamai. Every
# push to main republishes :latest. A push of a release tag vX.Y.Z also tags
# X.Y.Z, and a manual dispatch with a version input also tags that version.
# Docker Hub credentials come from the DOCKER_USER / DOCKER_TOKEN org secrets.
#
# Multi-arch (amd64 + arm64): the runtime base (dhi.io/eclipse-temurin) is
# published for the two platforms, and the Gradle build runs under QEMU for
# the arm64 leg.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra version tag (for example 0.1.0); optional'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="${INPUT_VERSION:-}" ;;
          esac
          if [ -n "$version" ] && ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]{0,63})?$ ]]; then
            echo "::error::version '$version' is not a semantic version such as 0.3.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compute tags
        id: tags
        # The version arrives through the environment, never interpolated
        # into the script; the step above already checked it is semver.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          svc="docker.io/pipestreamai/grpc-enrich:latest"
          if [ -n "$VERSION" ]; then
            svc="$svc,docker.io/pipestreamai/grpc-enrich:$VERSION"
          fi
          echo "svc=$svc" >> "$GITHUB_OUTPUT"
      - name: Build and push the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.svc }}
