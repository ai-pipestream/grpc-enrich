# CI gates for grpc-enrich: the same commands README.md documents (and the
# image build runs), so a red pull request shows here before it can break an
# image publish from main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A checksummed release download behaves the same on GitHub and Forgejo.
      - name: Install buf
        env:
          BUF_VERSION: 1.71.0
        run: |
          base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
          bin="buf-Linux-$(uname -m)"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$bin"
          curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
          install -m 0755 "$bin" /usr/local/bin/buf
          buf --version
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format -d --exit-code
      # Contract evolution is guarded against main: changes must be additive.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth 1
          buf breaking --against '.git#ref=origin/main'

  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: build and test
        run: ./gradlew --no-daemon build
